name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System & Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip setuptools
        pip install Cython==0.29.33 buildozer

    - name: Accept Licenses and Build APK
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer --allow-root android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Nancy-AI-APK
        path: bin/*.apk
        
